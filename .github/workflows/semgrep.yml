name: Semgrep Scan

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          publishToken: ${{ secrets.SEMGREP_TOKEN }}
          publishDeployment: true
